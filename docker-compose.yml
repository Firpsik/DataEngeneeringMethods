version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: etl-postgres
    environment:
      POSTGRES_DB: etl_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  etl-pipeline:
    build: .
    container_name: etl-pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: etl_database
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./data-pipeline:/app/data-pipeline
      - ./sql:/app/sql
      - ./config.py:/app/config.py

volumes:
  postgres_data:
